name: Sync Taginfo counts

on:
  schedule:
    - cron: '0 8 1 * *' 
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-taginfo
  cancel-in-progress: false

jobs:
  sync:
    name: Refresh Taginfo snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install (locked, no scripts)
        run: npm ci --ignore-scripts

      - name: Sync Taginfo counts
        run: npm run data:sync

      - name: Validate snapshot
        run: npm run data:validate

      - name: Mint app token
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Resolve app bot identity
        id: bot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "/users/${{ steps.app.outputs.app-slug }}%5Bbot%5D" --jq .id)
          echo "author=${{ steps.app.outputs.app-slug }}[bot] <$id+${{ steps.app.outputs.app-slug }}[bot]@users.noreply.github.com>" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.app.outputs.token }}
          author: ${{ steps.bot.outputs.author }}
          branch: chore/sync-taginfo
          delete-branch: true
          add-paths: data/elements.json
          commit-message: 'chore(data): sync taginfo counts'
          title: 'chore(data): sync taginfo counts'
          body: |
            Monthly refresh of the committed Taginfo snapshot.

            Generated by `.github/workflows/sync-counts.yml`.
