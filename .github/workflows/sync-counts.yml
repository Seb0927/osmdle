name: Sync Taginfo counts

on:
  schedule:
    - cron: '0 8 1 * *' 
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-taginfo
  cancel-in-progress: false

jobs:
  sync:
    name: Refresh Taginfo snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install (locked, no scripts)
        run: npm ci --ignore-scripts

      - name: Sync Taginfo counts
        run: npm run data:sync

      - name: Validate snapshot
        run: npm run data:validate

      - name: Mint app token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app.outputs.token }}
          branch: chore/sync-taginfo
          delete-branch: true
          add-paths: data/elements.json
          commit-message: 'chore(data): sync taginfo counts'
          title: 'chore(data): sync taginfo counts'
          body: |
            Monthly refresh of the committed Taginfo snapshot.

            Generated by `.github/workflows/sync-counts.yml`.
