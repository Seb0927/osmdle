name: Sync Taginfo counts

on:
  schedule:
    - cron: '0 5 1 * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-taginfo
  cancel-in-progress: false

jobs:
  sync:
    name: Refresh Taginfo snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Install (locked, no scripts)
        run: npm ci --ignore-scripts

      - name: Sync Taginfo counts
        run: npm run data:sync

      - name: Validate snapshot
        run: npm run data:validate

      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/sync-taginfo
          delete-branch: true
          add-paths: data/elements.json
          commit-message: 'chore(data): sync taginfo counts'
          title: 'chore(data): sync taginfo counts'
          body: |
            Monthly refresh of the committed Taginfo snapshot.

            Generated by `.github/workflows/sync-counts.yml`.
