pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,jsx,mjs,cjs,ts,tsx,json,jsonc,css}"
      run: npx --no-install biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    typecheck:
      run: npm run typecheck

commit-msg:
  commands:
    commitlint:
      run: npx --no-install commitlint --edit {1}
